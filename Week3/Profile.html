<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
    body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.profile {
    width: 450px;
    padding: 30px;
    border: 2px solid black;
    text-align: center;
    font-size: 18px;
}

.profile > img {
    width: 160px;
    height: 160px;
    border-radius: 50%;
}

.profile h2 {
    font-size: 28px;
}

.profile p {
    font-size: 18px;
}

#qr {
    display: none;
    margin-top: 20px;
}

#qr img {
    width: 302px;
    height: 306px;
}

button {
    font-size: 17px;
    padding: 8px 15px;
}
    </style>
</head>

<body>

    <div class="profile" id="profile">

        <img src="myphoto.jpg.jpg" alt="Profile Picture">

        <h2>Prabhat Bhatta</h2>

        <p>Gmail: prabhatbhatta.27@gmail.com</p>
        <p>Address: Kathmandu, Nepal</p>
        <p>DOB: 2005-09-12</p>

        <button id="showQR">Show QR</button>

        <div id="qr">
            <img src="Screenshot 2026-09-15 075822.png" alt="QR Code">
            <br><br>
            <button id="closeQR">Close QR</button>
        </div>

    </div>

    <script src="profile.js"></script>

</body>
</html>
